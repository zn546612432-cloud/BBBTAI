name: Publish isolated Story55 review (keep main site)
on:
  push:
    branches:
      - feat/story55-dev-snapshot-safety-20261101
    paths:
      - '.github/workflows/story55-review-pages.yml'
      - 'src/services/storage.js'
      - 'src/services/story55/test-snapshots.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: story55-review-pages
      url: ${{ steps.deployment.outputs.page_url }}review/55-20261101/
    steps:
      - name: Check out unchanged production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
      - name: Check out tested review commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: review-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild production files from main (unchanged content)
        working-directory: production-source
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES_BASE="/BBBTAI/" npm run build:pages
          mv dist production-dist
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/preview/" npm run build:pages
          mv dist production-dist/preview
          mv production-dist dist
      - name: Build and verify separate review
        working-directory: review-source
        run: |
          npm ci
          npm test
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/55-20261101/" npm run build:pages
          grep -q 'phone-preview' dist/index.html
          test -s dist/release.json
      - name: Stage review under its own nested path
        run: |
          mkdir -p production-source/dist/review/55-20261101
          cp -a review-source/dist/. production-source/dist/review/55-20261101/
          test -s production-source/dist/index.html
          test -s production-source/dist/preview/index.html
          test -s production-source/dist/review/55-20261101/index.html
      - uses: actions/configure-pages@v5
      - name: Upload production + isolated review
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist
      - name: Deploy unchanged production and review together
        id: deployment
        uses: actions/deploy-pages@v4
