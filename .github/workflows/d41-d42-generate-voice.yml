name: Record D41 and D42 fixed MiniMax dialogue
on:
  push:
    branches: [fix/d41-voice-and-invite]
    paths: ['scripts/generate-d41-d42-voice.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Record fixed dialogue with the existing approved voice
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_REGION: cn
        run: node scripts/generate-d41-d42-voice.mjs
      - name: Commit verified audio to the fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/story55/d41-d42/
          git commit -m 'assets: record fixed D41 and D42 dialogue'
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
