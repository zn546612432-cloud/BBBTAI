name: Temporary HYQ asset import and focused validation
on:
  push:
    branches: ['feature/hyq-player-social-20261126']
permissions:
  contents: write
jobs:
  asset-import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Import the two verified album artworks as local files
        shell: bash
        run: |
          set -euo pipefail
          dir=public/assets/music
          curl --fail --location --silent --show-error --retry 1 --max-time 45 'https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/0c/4b/ce/0c4bce82-ebc6-11c7-9b8c-1225d98313cb/4896004724778.jpg/1000x1000bb.jpg' -o "$dir/melatonin-cover.jpg"
          curl --fail --location --silent --show-error --retry 1 --max-time 45 'https://i.scdn.co/image/ab67616d0000b273229d6c87c77188d784a6c69e' -o "$dir/tonight-rain-cover.jpg"
          for file in "$dir/melatonin-cover.jpg" "$dir/tonight-rain-cover.jpg"; do
            test "$(file --brief --mime-type "$file")" = 'image/jpeg'
            test "$(wc -c < "$file")" -gt 5000
            file "$file"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('src/apps/music/features/shared/catalog.js')
          s=p.read_text()
          for old,new in [
              ("artist:'h3r3',duration:290}", "artist:'h3R3',duration:290,coverFormat:'jpg'}"),
              ("duration:281,format:'mp3',fallbackFormat:'m4a'}", "duration:281,format:'mp3',fallbackFormat:'m4a',coverFormat:'jpg'}"),
          ]:
              assert s.count(old)==1,old
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dir/melatonin-cover.jpg" "$dir/tonight-rain-cover.jpg" src/apps/music/features/shared/catalog.js
          git commit -m "assets: bundle verified Melatonin and Tonight Rain cover artwork"
          git push origin HEAD:refs/heads/feature/hyq-player-social-20261126
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Parse changed JavaScript
        run: |
          for f in src/apps/wechat/features/moments/{index,model,reactions}.js src/services/ai/moments-comments.js src/apps/wechat/components/views.js src/apps/music/{index.js,features/player/index.js,features/shared/catalog.js} src/main.js src/services/router.js server/ai-gateway.mjs; do node --check "$f"; done
      - name: Focused player Moments and music tests
        run: node --test tests/wechat-moments-player.test.mjs tests/music-playback.test.mjs
