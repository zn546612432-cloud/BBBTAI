name: D13 wallet and system call mobile acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/assets/story55/d13/**'
      - 'src/**'
      - 'scripts/d13-wallet-call-mobile-smoke.mjs'
      - 'tests/**'
      - '.github/workflows/d13-wallet-call-check.yml'
permissions:
  contents: read
jobs:
  d13-mobile:
    if: github.head_ref == 'fix/d13-bundled-voice' || startsWith(github.head_ref, 'assets/d13-minimax-seven-') || github.head_ref == 'feature/d13-wallet-intrusion-call' || github.head_ref == 'fix/d13-native-mail-wallet-call-20261108' || github.head_ref == 'fix/d13-short-charge-voice-call-native-20261108' || startsWith(github.head_ref, 'fix/d13-mail-midnight-clock-unified-') || startsWith(github.head_ref, 'fix/wechat-chronology-d13-shortcharge-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-story-skill.mjs
      - run: npm test
      - run: npm run build:pages
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Click real mobile flow including reload and cross-app navigation
        run: |
          mkdir -p /tmp/d13-site/BBBTAI
          cp -a dist/. /tmp/d13-site/BBBTAI/
          python3 -m http.server 5173 --bind 127.0.0.1 --directory /tmp/d13-site > /tmp/d13-server.log 2>&1 &
          SMOKE_URL=http://127.0.0.1:5173/BBBTAI/ node scripts/d13-wallet-call-mobile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d13-mobile-evidence
          path: qa-results/
