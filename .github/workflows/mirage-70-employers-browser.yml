name: MIRAGE 70 employers browser QA
on:
  pull_request:
    paths:
      - 'src/story/d15-d55/commissions.js'
      - 'src/story/d15-d55/employers.js'
      - 'src/story/d04/contract.js'
      - 'src/apps/mirage/**'
      - '.github/test-scripts/mirage-70-employers-browser.mjs'
      - '.github/workflows/mirage-70-employers-browser.yml'
  workflow_dispatch:

jobs:
  mirage-employers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local phone preview
        run: |
          node server/dev.mjs >/tmp/bbbtai-mirage-qa.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bbbtai-mirage-qa.log
          exit 1
      - name: Verify real desktop/mobile Mirage contact lifecycle
        run: node .github/test-scripts/mirage-70-employers-browser.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-70-employers-screenshots
          path: mirage-70-browser-results/
          if-no-files-found: warn
