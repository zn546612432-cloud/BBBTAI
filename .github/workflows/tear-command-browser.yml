name: TAI local command mobile acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/apps/ghost/deployment/tear-agent/**'
      - 'src/story/d25/tear-agent.js'
      - 'src/services/ai/tear-prompt.js'
      - 'scripts/verify-tear-command-browser.mjs'
      - '.github/workflows/tear-command-browser.yml'
permissions:
  contents: read
jobs:
  local-command:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-tear-command-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tear-command-mobile
          path: qa/tear-command/
          if-no-files-found: ignore
          retention-days: 14
