name: Publish isolated Weather 2025 review (preserve current Pages)

on:
  push:
    branches: [feature/unified-weather-phase3-meteocons-20261106]
    paths:
      - '.github/workflows/weather-phase3-review-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: weather-phase3-review-pages
      url: https://zn546612432-cloud.github.io/BBBTAI/review/weather-20261106/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/voice-lab/panel.js
      - run: npm test
      - run: npm run build:pages
      - name: Build isolated preview
        run: |
          mv dist production-dist
          PHONE_PREVIEW=true GITHUB_PAGES_BASE="/${{ github.event.repository.name }}/preview/" npm run build:pages
          mv dist production-dist/preview
          mv production-dist dist
      - name: Build Tai Vision in isolated save namespace
        run: |
          mv dist stable-dist
          PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/tai-vision-20261105/" npm run build:pages
          mkdir -p stable-dist/review/tai-vision-20261105
          cp -a dist/. stable-dist/review/tai-vision-20261105/
          rm -rf dist
          mv stable-dist dist
          test -s dist/review/tai-vision-20261105/index.html
          grep -q phone-preview dist/review/tai-vision-20261105/index.html
      # Each main release must retain separate, cache-versioned previews. Without
      # this, the upload-pages-artifact action would erase every /review/ URL.
      - name: Check out isolated story55 review
        uses: actions/checkout@v4
        with:
          ref: feat/story55-dev-snapshot-safety-20261101
          path: .review-sources/story55
      - name: Check out isolated d03 review
        uses: actions/checkout@v4
        with:
          ref: feature/d03-flow-ghost-kira-20261101
          path: .review-sources/d03
      - name: Check out isolated d55 review
        uses: actions/checkout@v4
        with:
          ref: feature/d55-final-handoff-20261101
          path: .review-sources/d55
      - name: Check out isolated badges review
        uses: actions/checkout@v4
        with:
          ref: feature/ios-unread-home-badges-20261102
          path: .review-sources/badges
      - name: Check out isolated d01cross review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-cross-app-story-20261102
          path: .review-sources/d01cross
      - name: Check out isolated d01 review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-linked-story-20261102
          path: .review-sources/d01
      - name: Check out isolated NoApp V2 review
        uses: actions/checkout@v4
        with:
          ref: fix/noapp-call-v2-interrupt-dedupe-20261103
          path: .review-sources/noapp-v2
      - name: Check out isolated NoApp V3 review
        uses: actions/checkout@v4
        with:
          ref: fix/noapp-v3-channel-hangup-longcall-20261103
          path: .review-sources/noapp-v3
      - name: Check out isolated Xitai v10 review
        uses: actions/checkout@v4
        with:
          ref: xitai-v10-structured-action-protocol-20261102
          path: .review-sources/xitai-v10
      - name: Check out isolated Xitai bonding review
        uses: actions/checkout@v4
        with:
          ref: feature/xitai-bond-call-pt-20261102
          path: .review-sources/xitai-bond
      - name: Check out isolated Xitai callfix review
        uses: actions/checkout@v4
        with:
          ref: fix/xitai-call-voice-natural-20261102
          path: .review-sources/xitai-callfix
      - name: Check out isolated Xitai calm review
        uses: actions/checkout@v4
        with:
          ref: fix/xitai-fixed-calm-voice-20261102
          path: .review-sources/xitai-calm
      - name: Check out isolated Xitai phone review
        uses: actions/checkout@v4
        with:
          ref: feature/xitai-phone-command-20261102
          path: .review-sources/xitai-phone
      - name: Check out isolated D01 LINK review
        uses: actions/checkout@v4
        with:
          ref: fix/d01-pipe-solved-dev-skip-20261102
          path: .review-sources/d01linkfix
      - name: Check out isolated D01 Files review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-file-open-flow-20261102
          path: .review-sources/d01files
      - name: Preserve isolated historical review sites
        run: |
          for spec in \
            'story55:55-20261101' \
            'd03:d03-flow-20261101' \
            'd55:d55-finale-20261101' \
            'badges:ios-badges-20261102' \
            'd01cross:d01-cross-app-20261102' \
            'd01:d01-20261102' \
            'd01files:d01-file-20261102' \
            'd01linkfix:d01-linkfix-20261102' \
            'xitai-bond:xitai-bond-20261102' \
            'xitai-callfix:xitai-callfix-20261102' \
            'xitai-calm:xitai-calm-20261102' \
            'xitai-phone:xitai-phone-20261102' \
            'xitai-v10:xitai-v10-20261102' \
            'noapp-v2:noapp-v2-20261103' \
            'noapp-v3:noapp-v3-20261103'; do
            key="${spec%%:*}"
            name="${spec#*:}"
            (cd ".review-sources/$key"; npm ci; GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/$name/" npm run build:pages)
            mkdir -p "dist/review/$name"
            cp -a ".review-sources/$key/dist/." "dist/review/$name/"
            test -s "dist/review/$name/index.html"
            test -s "dist/review/$name/release.json"
          done
      # Do not touch main or replace the existing production and review trees.
      - name: Check out tested weather phase 3 separately
        uses: actions/checkout@v4
        with:
          ref: feature/unified-weather-phase3-meteocons-20261106
          path: .review-sources/weather
      - name: Build isolated weather test site with its own save namespace
        working-directory: .review-sources/weather
        run: |
          npm ci
          npm test
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/weather-20261106/" npm run build:pages
          test -s dist/index.html
          test -s dist/release.json
          test -s dist/assets/meteocons/LICENSE
          test -s dist/assets/meteocons/SOURCES.json
          grep -q phone-preview dist/index.html
      - name: Preserve original production and review URLs; stage weather review
        run: |
          mkdir -p dist/review/weather-20261106
          cp -a .review-sources/weather/dist/. dist/review/weather-20261106/
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const root='dist/review/weather-20261106';
          const release=JSON.parse(readFileSync(root+'/release.json','utf8'));
          const slugList=['clear-day','clear-night','partly-cloudy-day','partly-cloudy-night','overcast','drizzle','thunderstorms-day-rain','thunderstorms-night-rain'];
          for(const slug of slugList){
            for(const folder of ['fill','static']){
              const file=root+'/assets/meteocons/'+folder+'/'+slug+'.svg';
              if(!existsSync(file))throw Error('Missing weather icon: '+file);
            }
          }
          const js=readFileSync(root+'/releases/'+release.version+'/src/apps/weather/meteocons.js','utf8');
          for(const fragment of ['assets/meteocons/fill/','assets/meteocons/static/']){
            if(!js.includes(release.url+fragment))throw Error('Missing versioned icon reference: '+fragment);
          }
          if(!existsSync('dist/preview/index.html')||!existsSync('dist/review/55-20261101/index.html'))throw Error('Historical Pages sites are missing');
          console.log('Verified production, preview, old reviews, and isolated weather SVG assets for '+release.version);
          NODE
      - name: Set up Python for image optimization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compress icon atlases in all production and preview builds
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-icon-atlases.py dist
          test -s dist/icons/glass-atlas.webp
          test -s dist/icons/glass-utilities.webp
      - name: Verify packaged image assets and release URLs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const files=[
            'dist/index.html',
            'dist/apps/mirage/world-land.svg',
            'dist/apps/mirage/skull.svg',
            `dist/releases/${release.version}/src/apps/mirage/art.js`,
            `dist/releases/${release.version}/apps/mirage/world-land.svg`,
            `dist/releases/${release.version}/apps/mirage/skull.svg`
          ];
          const media=[
            'apps/mirage/world-land.svg',
            'apps/wechat/avatars/originals/ximeng.jpeg',
            'apps/wechat/avatars/originals/xiwang.jpeg',
            'apps/wechat/avatars/originals/awei.jpeg',
            'apps/wechat/avatars/originals/hufeng.jpeg',
            'apps/wechat/avatars/originals/xiaoxin.jpeg',
            'apps/wechat/avatars/originals/zaizai.jpeg',
            'apps/wechat/avatars/originals/fulongsheng.jpeg',
            'apps/wechat/media/user-group-photo.webp',
            'apps/wechat/media/user-food-rice.jpeg',
            'apps/wechat/media/moment-cat-video.mp4'
          ];
          const preview=JSON.parse(readFileSync('dist/preview/release.json','utf8'));
          for(const [root,version] of [['dist',release],['dist/preview',preview]]){
            for(const item of media){
              files.push(root+'/'+item);
              files.push(root+'/releases/'+version.version+'/'+item);
            }
            const css=readFileSync(root+'/releases/'+version.version+'/src/apps/mirage/styles.css','utf8');
            if(!css.includes(version.url+'apps/mirage/world-land.svg'))
              throw new Error('MIRAGE map URL not versioned for '+root);
          }
          for(const file of files)if(!existsSync(file))throw new Error('Missing Pages asset: '+file);
          const index=readFileSync('dist/index.html','utf8');
          if(!index.includes(release.url+'src/main.js'))throw new Error('Main entry is not version-pinned');
          console.log('Verified Pages resources:',release.version);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
