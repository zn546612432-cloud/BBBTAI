name: Tai Supabase provider connectivity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/services/ai/gateway.js'
      - 'src/services/ai/supabase-gateway.js'
      - 'supabase/functions/tai-provider-gateway/**'
      - 'supabase/migrations/*tai_gateway_quotas.sql'
      - '.github/test-scripts/tai-cloud-provider-smoke.mjs'
      - '.github/workflows/tai-cloud-provider-connectivity.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authenticated Supabase endpoint, no paid provider calls
        run: node .github/test-scripts/tai-cloud-provider-smoke.mjs
