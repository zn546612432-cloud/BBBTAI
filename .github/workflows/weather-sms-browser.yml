name: D23-D25 Macau weather and SMS browser QA
on:
  pull_request:
    paths:
      - 'src/services/weather/**'
      - 'src/services/story55/runtime.js'
      - 'src/apps/weather/**'
      - 'src/apps/wechat/avatars.js'
      - 'tests/d23-d25-weather-sms-avatar.test.mjs'
      - '.github/test-scripts/weather-sms-browser.mjs'
      - '.github/workflows/weather-sms-browser.yml'
  workflow_dispatch:

jobs:
  weather-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start local phone preview
        run: |
          node server/dev.mjs >/tmp/bbbtai-weather-sms-qa.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bbbtai-weather-sms-qa.log
          exit 1
      - name: Verify native Weather and SMS scenes in Chromium
        run: node .github/test-scripts/weather-sms-browser.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d23-d25-weather-sms-screenshots
          path: weather-sms-qa-results/
          if-no-files-found: warn
