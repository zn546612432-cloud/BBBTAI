name: Weather phone - independent temporary Netlify preview
on:
  push:
    branches: [feature/unified-weather-phase3-meteocons-20261106]
    paths: ['.github/workflows/weather-netlify-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-weather-phase3-meteocons-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check static game and offline weather files
        run: |
          test -s dist/index.html
          test -s dist/assets/meteocons/LICENSE
          test -s dist/assets/meteocons/fill/clear-day.svg
          test -s dist/assets/meteocons/static/clear-day.svg
          test -s dist/src/services/weather/data/macau-2025-hourly.js
      - name: Publish disposable independent weather phone preview
        shell: bash
        run: |
          set -euo pipefail
          # Public preview only; never modify the user's existing Netlify sites.
          # Netlify anonymous deploys expire unless claimed within one hour.
          if ! npx --yes netlify-cli@latest deploy --allow-anonymous --dir=dist --no-build --json > /tmp/weather-netlify-preview.json 2>/tmp/weather-netlify-preview.err; then
            echo "Netlify anonymous preview failed (no existing site modified)"
            sed -E 's/(drop[_-]?token|claim[_-]?token|authorization)[^[:space:]]*/[redacted]/gi' /tmp/weather-netlify-preview.err | tail -n 20
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const obj=JSON.parse(readFileSync('/tmp/weather-netlify-preview.json','utf8'));
          // Anonymous CLI uses site_url instead of the normal deploy_url.
          // This is the PUBLIC visitor URL; never print claim_url, claim_command or password.
          const raw=typeof obj.site_url==='string'?obj.site_url.trim():'';
          const live=raw.startsWith('https://')?raw:raw.startsWith('http://')?'https://'+raw.slice(7):'https://'+raw;
          const parsed=new URL(live);
          if(parsed.protocol!=='https:'||!parsed.hostname||raw.length<5)
            throw Error('Invalid public anonymous preview URL');
          const summary='### Weather preview (temporary)\n\n'+live+'\n\nThis is a disposable one-hour anonymous deploy. It is separate from BBBTAI main and all existing Netlify projects.\n';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          console.log('Weather phone preview: '+live);
          NODE
