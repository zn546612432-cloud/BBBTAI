name: Publish isolated D03 review (preserve production and Story55 review)
on:
  push:
    branches:
      - feature/d03-flow-ghost-kira-20261101
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: d03-review-pages
      url: https://zn546612432-cloud.github.io/BBBTAI/review/d03-flow-20261101/
    steps:
      - name: Checkout unchanged main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
      - name: Checkout D03 review commit
        uses: actions/checkout@v4
        with:
          ref: feature/d03-flow-ghost-kira-20261101
          path: d03-source
      - name: Checkout prior Story55 review
        uses: actions/checkout@v4
        with:
          ref: feat/story55-dev-snapshot-safety-20261101
          path: story55-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: d03-source/package-lock.json
      - name: Restore main and main preview unchanged
        working-directory: production-source
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES_BASE="/BBBTAI/" npm run build:pages
          mv dist production-dist
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/preview/" npm run build:pages
          mv dist production-dist/preview
          mv production-dist dist
      - name: Restore earlier Story55 review
        working-directory: story55-source
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/55-20261101/" npm run build:pages
          test -s dist/index.html
      - name: Test and build new isolated D03 review
        working-directory: d03-source
        run: |
          npm ci
          npm test
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/d03-flow-20261101/" npm run build:pages
          grep -q 'phone-preview' dist/index.html
          test -s dist/release.json
      - name: Combine unchanged production and isolated reviews
        run: |
          mkdir -p production-source/dist/review/55-20261101
          mkdir -p production-source/dist/review/d03-flow-20261101
          cp -a story55-source/dist/. production-source/dist/review/55-20261101/
          cp -a d03-source/dist/. production-source/dist/review/d03-flow-20261101/
          test -s production-source/dist/index.html
          test -s production-source/dist/preview/index.html
          test -s production-source/dist/review/55-20261101/index.html
          test -s production-source/dist/review/d03-flow-20261101/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist
      - uses: actions/deploy-pages@v4
