name: D08-D10 simulated iPhone acceptance

on:
  push:
    branches: [feature/d08-d10-quiet-days-20261107]
    paths:
      - '.github/workflows/d08-d10-mobile-check.yml'
      - '.github/test-scripts/d08-d10-mobile-browser-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise actual published review in 390x844 touch viewport
        env:
          D08_D10_PREVIEW_URL: https://zn546612432-cloud.github.io/BBBTAI/review/d08-d10-20261107/
        run: node .github/test-scripts/d08-d10-mobile-browser-smoke.mjs
      - name: Save phone browser screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d08-d10-iphone-ui-review
          path: d08-d10-mobile-results/
          if-no-files-found: ignore
          retention-days: 14
