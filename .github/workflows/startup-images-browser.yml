name: Startup image readiness browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/system/preload.js'
      - 'src/system/icon-assets.js'
      - 'src/apps/wechat/features/moments/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/verify-startup-images-browser.mjs'
      - 'scripts/verify-d06-sunset-browser.mjs'
      - '.github/workflows/startup-images-browser.yml'
permissions:
  contents: read
jobs:
  startup-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-icon-atlases.py dist
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-startup-images-browser.mjs
      - run: node scripts/verify-d06-sunset-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-image-readiness
          path: |
            qa/startup-images/
            qa/d06-sunset/
          if-no-files-found: warn
          retention-days: 14
