name: Import Macau 2025 historical weather to isolated branch
on:
  push:
    branches:
      - feature/unified-weather-phase2-history-20261106
    paths:
      - 'scripts/import-weather-history.mjs'
      - '.github/workflows/import-weather-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-offline-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-weather-phase2-history-20261106
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate 55 days of ERA5 hourly historical data
        run: node scripts/import-weather-history.mjs
      - name: Commit the imported file only to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add src/services/weather/data/macau-2025-hourly.js
          if git diff --cached --quiet; then
            echo 'Weather history already matches the current offline file'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(weather): freeze 55 days / 1320 hours of ERA5 Macau weather"
          git push origin HEAD:feature/unified-weather-phase2-history-20261106
