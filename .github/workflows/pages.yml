name: Deploy phone game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/voice-lab/panel.js
      - run: npm test
      - run: npm run build:pages
      - name: Build isolated preview
        run: |
          mv dist production-dist
          PHONE_PREVIEW=true GITHUB_PAGES_BASE="/${{ github.event.repository.name }}/preview/" npm run build:pages
          mv dist production-dist/preview
          mv production-dist dist
      - name: Verify packaged image assets and release URLs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const files=[
            'dist/index.html',
            'dist/apps/mirage/world-land.svg',
            'dist/apps/mirage/skull.svg',
            `dist/releases/${release.version}/src/apps/mirage/art.js`,
            `dist/releases/${release.version}/apps/mirage/world-land.svg`,
            `dist/releases/${release.version}/apps/mirage/skull.svg`
          ];
          const media=[
            'apps/mirage/world-land.svg',
            'apps/wechat/avatars/originals/ximeng.jpeg',
            'apps/wechat/avatars/originals/xiwang.jpeg',
            'apps/wechat/avatars/originals/awei.jpeg',
            'apps/wechat/avatars/originals/hufeng.jpeg',
            'apps/wechat/avatars/originals/xiaoxin.jpeg',
            'apps/wechat/avatars/originals/zaizai.jpeg',
            'apps/wechat/avatars/originals/fulongsheng.jpeg',
            'apps/wechat/media/user-group-photo.webp',
            'apps/wechat/media/user-food-rice.jpeg',
            'apps/wechat/media/moment-cat-video.mp4'
          ];
          const preview=JSON.parse(readFileSync('dist/preview/release.json','utf8'));
          for(const [root,version] of [['dist',release],['dist/preview',preview]]){
            for(const item of media){
              files.push(root+'/'+item);
              files.push(root+'/releases/'+version.version+'/'+item);
            }
            const css=readFileSync(root+'/releases/'+version.version+'/src/apps/mirage/styles.css','utf8');
            if(!css.includes(version.url+'apps/mirage/world-land.svg'))
              throw new Error('MIRAGE map URL not versioned for '+root);
          }
          for(const file of files)if(!existsSync(file))throw new Error('Missing Pages asset: '+file);
          const index=readFileSync('dist/index.html','utf8');
          if(!index.includes(release.url+'src/main.js'))throw new Error('Main entry is not version-pinned');
          console.log('Verified Pages resources:',release.version);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
