name: Deploy phone game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/voice-lab/panel.js
      - run: npm test
      - run: npm run build:pages
      # Friends share the exact same release modules and public assets as main.
      # Only the entry HTML opts into hiding author/debug controls.
      - name: Create isolated friends test entry
        run: |
          mkdir -p dist/review/friends-test
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const html=await readFile('dist/index.html','utf8');
          if(!html.includes('ximeng-release')||!html.includes('<head>'))throw Error('Production entry not ready');
          const friends=html.replace('<head>','<head><meta name="phone-friends-test" content="true"><meta name="phone-preview" content="true">').replace('<title>','<title>TEST · ');
          await writeFile('dist/review/friends-test/index.html',friends);
          NODE
      - name: Build Tai Vision in isolated save namespace
        run: |
          mv dist stable-dist
          PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/tai-vision-20261105/" npm run build:pages
          mkdir -p stable-dist/review/tai-vision-20261105
          cp -a dist/. stable-dist/review/tai-vision-20261105/
          rm -rf dist
          mv stable-dist dist
          test -s dist/review/tai-vision-20261105/index.html
          grep -q phone-preview dist/review/tai-vision-20261105/index.html
      # The main Pages workflow builds only 3 independent entry points:
      # production, Story55 reference and Tai Vision.
      # Retired review snapshots stay in their Git branches, not the deployed
      # Pages artifact. DO NOT delete historical branches or gameplay assets.
      - name: Check out Story55 comparison snapshot
        uses: actions/checkout@v4
        with:
          ref: feat/story55-dev-snapshot-safety-20261101
          path: .review-sources/story55
      - name: Build Story55 comparison with isolated storage namespace
        run: |
          (
            cd .review-sources/story55
            npm ci
            GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/55-20261101/" npm run build:pages
          )
          mkdir -p dist/review/55-20261101
          cp -a .review-sources/story55/dist/. dist/review/55-20261101/
          test -s dist/review/55-20261101/index.html
          test -s dist/review/55-20261101/release.json
      - name: Set up Python for image optimization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compress icon atlases in all production and preview builds
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-icon-atlases.py dist
          test -s dist/icons/glass-atlas.webp
          test -s dist/icons/glass-utilities.webp
      - name: Verify packaged image assets and release URLs
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const files=[
            'dist/index.html',
            'dist/apps/mirage/world-land.svg',
            'dist/apps/mirage/skull.svg',
            `dist/releases/${release.version}/src/apps/mirage/art.js`,
            `dist/releases/${release.version}/apps/mirage/world-land.svg`,
            `dist/releases/${release.version}/apps/mirage/skull.svg`
          ];
          const media=[
            'apps/mirage/world-land.svg',
            'apps/wechat/avatars/originals/ximeng.jpeg',
            'apps/wechat/avatars/originals/xiwang.jpeg',
            'apps/wechat/avatars/originals/awei.jpeg',
            'apps/wechat/avatars/originals/hufeng.jpeg',
            'apps/wechat/avatars/originals/xiaoxin.jpeg',
            'apps/wechat/avatars/originals/zaizai.jpeg',
            'apps/wechat/avatars/originals/fulongsheng.jpeg',
            'apps/wechat/media/user-group-photo.webp',
            'apps/wechat/media/user-food-rice.jpeg',
            'apps/wechat/media/moment-cat-video.mp4'
          ];
          for(const [root,version] of [['dist',release]]){
            for(const item of media){
              files.push(root+'/'+item);
              files.push(root+'/releases/'+version.version+'/'+item);
            }
            const css=readFileSync(root+'/releases/'+version.version+'/src/apps/mirage/styles.css','utf8');
            if(!css.includes(version.url.replace(/releases\/[^/]+\/$/,'')+'apps/mirage/world-land.svg'))
              throw new Error('MIRAGE map URL not stable for '+root);
          }
          for(const file of files)if(!existsSync(file))throw new Error('Missing Pages asset: '+file);
          const index=readFileSync('dist/index.html','utf8');
          if(!index.includes(release.url+'src/main.js'))throw new Error('Main entry is not version-pinned');
          console.log('Verified Pages resources:',release.version);
          NODE
      - name: Audit retained site paths and enforce artifact size limit
        run: node scripts/audit-pages-site.mjs dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # Pages' artifact metadata endpoint can lag behind the successful upload.
  # Separate jobs preserve the existing build output and give metadata time to
  # propagate before deploy-pages looks it up.
  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n1 || true)"
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact ready: $artifact_id"
              # The Pages deployment API has an additional metadata index.
              sleep 15
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/18)"
            sleep 8
          done
          echo "::error::Pages artifact did not appear after upload"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '600000'
