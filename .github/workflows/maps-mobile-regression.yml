name: Verify Macau map on mobile browsers
on:
  push:
    branches:
      - fix/maps-offline-startup-20261103
    paths:
      - scripts/render-offline-macau-image.py
      - scripts/verify-offline-map-browser.mjs
      - src/apps/maps/**
      - src/system/preload.js
      - src/main.js
      - index.html
      - tests/map-startup-smoke.test.mjs
      - .github/workflows/maps-mobile-regression.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render geographic raster from already bundled open vector data
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/render-offline-macau-image.py
          test -s public/apps/maps/macau-offline.webp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate JavaScript and all unit tests
        run: |
          npm ci
          node --check src/apps/maps/leaflet.js
          node --check src/main.js
          node --check src/system/preload.js
          npm test
      - name: Build local phone and verify mobile browsers
        run: |
          npm run build
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          node scripts/verify-offline-map-browser.mjs
      - name: Verify GitHub Pages release package
        run: |
          npm run build:pages
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const release=JSON.parse(readFileSync('dist/release.json','utf8'));
          const image='dist/releases/'+release.version+'/apps/maps/macau-offline.webp';
          if(!existsSync(image))throw Error('Pages did not include bundled map image');
          console.log('Pages release includes Macau offline image',image);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macau-mobile-map-screenshots
          path: preview/browser-smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit verified offline image to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apps/maps/macau-offline.webp
          if ! git diff --cached --quiet; then
            git commit -m "data(maps): bundle fast offline Macau raster [skip ci]"
            git push origin HEAD:fix/maps-offline-startup-20261103
          fi
