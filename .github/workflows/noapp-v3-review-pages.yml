name: Publish NoApp V3 call-bridge review (preserve production and previous previews)
on:
  push:
    branches:
      - fix/noapp-v3-channel-hangup-longcall-20261103
    paths:
      - '.github/workflows/noapp-v3-review-pages.yml'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: noapp-v3-review-pages
      url: https://zn546612432-cloud.github.io/BBBTAI/review/noapp-v3-20261103/
    steps:
      - name: Checkout production unchanged
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
      - name: Checkout NoApp V3 review branch
        uses: actions/checkout@v4
        with:
          path: noapp-v3-source
      - name: Checkout previous NoApp V2 review branch
        uses: actions/checkout@v4
        with:
          ref: fix/noapp-call-v2-interrupt-dedupe-20261103
          path: noapp-v2-source
      - name: Checkout previous v10 action protocol review
        uses: actions/checkout@v4
        with:
          ref: xitai-v10-structured-action-protocol-20261102
          path: v10-source
      - name: Checkout Story55 snapshot review
        uses: actions/checkout@v4
        with:
          ref: feat/story55-dev-snapshot-safety-20261101
          path: story55-source
      - name: Checkout earlier D03 review
        uses: actions/checkout@v4
        with:
          ref: feature/d03-flow-ghost-kira-20261101
          path: d03-source
      - name: Checkout earlier D55 review
        uses: actions/checkout@v4
        with:
          ref: feature/d55-final-handoff-20261101
          path: d55-source
      - name: Checkout prior iOS badge review
        uses: actions/checkout@v4
        with:
          ref: feature/ios-unread-home-badges-20261102
          path: badges-source
      - name: Checkout fixed-calm Xitai review
        uses: actions/checkout@v4
        with:
          ref: fix/xitai-fixed-calm-voice-20261102
          path: xitai-calm-source
      - name: Checkout previous Xitai callfix review
        uses: actions/checkout@v4
        with:
          ref: fix/xitai-call-voice-natural-20261102
          path: xitai-callfix-source
      - name: Checkout earlier Xitai bonding review
        uses: actions/checkout@v4
        with:
          ref: feature/xitai-bond-call-pt-20261102
          path: xitai-bond-source
      - name: Checkout previous D01 LINK fix review
        uses: actions/checkout@v4
        with:
          ref: fix/d01-pipe-solved-dev-skip-20261102
          path: d01linkfix-source
      - name: Checkout prior D01 Files review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-file-open-flow-20261102
          path: d01files-source
      - name: Checkout original D01 playable review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-linked-story-20261102
          path: d01old-source
      - name: Checkout alternative D01 cross-app review
        uses: actions/checkout@v4
        with:
          ref: feature/d01-cross-app-story-20261102
          path: d01cross-source
      - name: Checkout previous Xitai phone review
        uses: actions/checkout@v4
        with:
          ref: feature/xitai-phone-command-20261102
          path: xitai-phone-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild production and its unchanged preview
        working-directory: production-source
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES_BASE="/BBBTAI/" npm run build:pages
          mv dist production-dist
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/preview/" npm run build:pages
          mv dist production-dist/preview
          mv production-dist dist
      - name: Rebuild existing isolated reviews
        run: |
          for spec in \
            'story55-source:55-20261101' \
            'd03-source:d03-flow-20261101' \
            'd55-source:d55-finale-20261101' \
            'badges-source:ios-badges-20261102' \
            'd01cross-source:d01-cross-app-20261102' \
            'd01old-source:d01-20261102' \
            'd01files-source:d01-file-20261102' \
            'd01linkfix-source:d01-linkfix-20261102' \
            'xitai-bond-source:xitai-bond-20261102' \
            'xitai-callfix-source:xitai-callfix-20261102' \
            'xitai-calm-source:xitai-calm-20261102' \
            'xitai-phone-source:xitai-phone-20261102' \
            'v10-source:xitai-v10-20261102' \
            'noapp-v2-source:noapp-v2-20261103'; do
            folder="${spec%%:*}"; name="${spec#*:}"
            (cd "$folder"; npm ci; GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/$name/" npm run build:pages)
            mkdir -p "production-source/dist/review/$name"
            cp -a "$folder/dist/." "production-source/dist/review/$name/"
          done
      - name: Test and build isolated NoApp V3
        working-directory: noapp-v3-source
        run: |
          npm ci
          npm test
          GITHUB_SHA="$(git rev-parse HEAD)" PHONE_PREVIEW=true GITHUB_PAGES_BASE="/BBBTAI/review/noapp-v3-20261103/" npm run build:pages
          test -s dist/index.html
          grep -q 'phone-preview' dist/index.html
          test -s dist/release.json
      - name: Stage NoApp V3 mobile preview without replacing production
        run: |
          mkdir -p production-source/dist/review/noapp-v3-20261103
          cp -a noapp-v3-source/dist/. production-source/dist/review/noapp-v3-20261103/
          test -s production-source/dist/index.html
          test -s production-source/dist/preview/index.html
          test -s production-source/dist/review/xitai-v10-20261102/index.html
          test -s production-source/dist/review/noapp-v2-20261103/index.html
          test -s production-source/dist/review/noapp-v3-20261103/index.html
          test -s production-source/dist/review/d01-20261102/index.html
          test -s production-source/dist/review/d01-file-20261102/index.html
          test -s production-source/dist/review/d01-linkfix-20261102/index.html
          test -s production-source/dist/review/xitai-bond-20261102/index.html
          test -s production-source/dist/review/xitai-callfix-20261102/index.html
          test -s production-source/dist/review/xitai-calm-20261102/index.html
          test -s production-source/dist/review/xitai-phone-20261102/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist
      - name: Publish unchanged production and all isolated reviews including NoApp V3
        uses: actions/deploy-pages@v4
