name: Lisbon map mobile acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/apps/maps/**'
      - 'public/apps/maps/lisbon-offline.webp'
      - 'scripts/verify-lisbon-map-browser.mjs'
      - '.github/workflows/lisbon-map-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-lisbon-map-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lisbon-map-mobile
          path: qa/lisbon-map/
          if-no-files-found: ignore
          retention-days: 14
