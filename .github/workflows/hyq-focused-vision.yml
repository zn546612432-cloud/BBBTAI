name: Verify HYQ album release on Cloudflare
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public production and friends entrypoints and updated modules
        run: |
          python3 - <<'PY'
          import urllib.request, concurrent.futures, json, time
          root='https://bbbtai.pages.dev/'
          paths={
            '':['/src/main.js'],
            'review/friends-test/':['phone-friends-test'],
            'src/apps/photos/features/picker/index.js':['openGamePhotoPicker','暫無照片'],
            'src/apps/wechat/index.js':['openGamePhotoPicker','renderGamePhotoPicker'],
            'src/apps/wechat/features/moments/index.js':['openGamePhotoPicker'],
            'src/apps/wechat/features/moments/reactions.js':['reactionPolicy=2','repairTodayLikes','1+Math.floor(random()*names.length)']}
          def probe(item):
            path,markers=item
            try:
              req=urllib.request.Request(root+path+'?verify=390-'+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                body=r.read().decode('utf-8','replace')
                return path, r.status, all(x in body for x in markers), r.headers.get('Content-Type')
            except Exception as e:return path,0,False,str(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            result=list(pool.map(probe,paths.items()))
          print('LIVE_RESULTS',json.dumps(result,ensure_ascii=False))
          assert all(x[1]==200 and x[2] for x in result),'Cloudflare release not yet confirmed'
          PY
