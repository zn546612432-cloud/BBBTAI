name: HYQ final affected tests only
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify affected tests, no repeated full suite
        run: node --test --test-name-pattern='music uses actual track|avatar paths are base-aware|D06 sunset video' tests/story-notification-haptic.test.mjs tests/wechat-moments.test.mjs
      - run: node --check src/apps/wechat/features/moments/index.js
