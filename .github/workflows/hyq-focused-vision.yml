name: WeChat group final targeted tests and mobile browser
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify changed group and messaging surfaces
        run: node --test tests/wechat-group-eggs.test.mjs tests/wechat-conversation.test.mjs tests/wechat-notifications.test.mjs tests/d46-group.test.mjs
      - run: npm run build:pages
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start local phone
        run: |
          node server/dev.mjs >/tmp/bbbtai-wechat-qa.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bbbtai-wechat-qa.log
          exit 1
      - run: node group-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-group-mobile-evidence
          path: wechat-group-browser-results/
          if-no-files-found: warn
