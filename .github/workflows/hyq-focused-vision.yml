name: HYQ album and reaction focused validation
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused Moments and Photos regressions
        run: node --test tests/wechat-moments-player.test.mjs tests/photos-ui.test.mjs
      - name: Changed module syntax
        run: |
          for f in src/apps/photos/features/picker/index.js src/apps/wechat/index.js src/apps/wechat/features/moments/{index,reactions}.js; do node --check "$f"; done
      - run: npm run build:pages
