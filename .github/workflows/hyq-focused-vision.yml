name: Verify WeChat group Cloudflare release
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public production and friends code
        run: |
          python3 - <<'PY'
          import urllib.request, concurrent.futures, json, time
          root='https://bbbtai.pages.dev/'
          paths={
             '':['/src/main.js'],
             'review/friends-test/':['phone-friends-test'],
             'src/apps/wechat/features/group/index.js':['renderGroupInfo','該用戶暫時無法拉入群聊'],
             'src/apps/wechat/features/group/runtime.js':['inviteFather','leaveGroup','groupEggsDue'],
             'src/apps/wechat/features/group/lines.js':['蒙哥的中二病還沒好嗎','是誰在打我'],
             'src/apps/wechat/components/views.js':['wx-discover-dot','wx-red-dot'],
             'src/apps/wechat/features/group/classifier.js':['deepseek-flash','語義分類器'],
             'src/apps/photos/features/picker/index.js':['openGamePhotoPicker'],
             'src/apps/wechat/features/moments/reactions.js':['repairTodayLikes']
          }
          def probe(item):
            path,markers=item
            try:
              req=urllib.request.Request(root+path+'?verify=391-'+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                body=r.read().decode('utf-8','replace')
                return path,r.status,all(x in body for x in markers),r.headers.get('Content-Type')
            except Exception as e:return path,0,False,str(e)
          for attempt in range(3):
            with concurrent.futures.ThreadPoolExecutor(max_workers=9) as pool:
              result=list(pool.map(probe,paths.items()))
            print('LIVE_RESULTS',json.dumps(result,ensure_ascii=False),flush=True)
            if all(x[1]==200 and x[2] for x in result): break
            if attempt<2: time.sleep(8)
          assert all(x[1]==200 and x[2] for x in result),'Cloudflare release not yet confirmed'
          PY
