name: Verify home indicator fade and bottom navigation
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/touch-gestures.test.mjs tests/wechat-conversation.test.mjs
      - run: node --check src/main.js
      - run: npm run build
      - run: npm install --no-save playwright@1.55.0
      - name: Use preinstalled browser
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Start phone
        run: |
          node server/dev.mjs >/tmp/phone.log 2>&1 &
          for i in {1..25}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/phone.log
          exit 1
      - run: node homebar-qa.mjs
