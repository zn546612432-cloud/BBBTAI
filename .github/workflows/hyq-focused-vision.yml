name: WeChat group eggs focused verification
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused group, UI, notification, Moments and native delivery tests
        run: node --test tests/wechat-group-eggs.test.mjs tests/wechat-conversation.test.mjs tests/wechat-ui.test.mjs tests/wechat-notifications.test.mjs tests/wechat-moments-player.test.mjs tests/d46-group.test.mjs tests/linked-contract-delivery.test.mjs
      - name: Check changed source syntax
        run: |
          for f in src/apps/wechat/features/group/*.js src/apps/wechat/index.js src/apps/wechat/components/{chat-view,views,group-avatar}.js src/main.js src/services/messaging/{delivery,phone-story-scheduler,authored-incoming}.js src/services/story55/runtime.js src/system/shell.js; do node --check "$f"; done
      - run: npm run build:pages
