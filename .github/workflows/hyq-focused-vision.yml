name: Check Cloudflare PR 393 release
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read live release files
        run: |
          python3 - <<'PY'
          import urllib.request,concurrent.futures,time,json
          root='https://bbbtai.pages.dev/'
          paths={'':['/src/main.js'],'review/friends-test/':['phone-friends-test'],'src/apps/wechat/features/group/father-notice.js':['FATHER_NOTICE_COMBO','d47-wang','好了，都別說了。'],'src/apps/wechat/features/group/runtime.js':['advancePendingFather','熙旺清除了群公告'],'src/apps/wechat/features/group/classifier.js':['father_harm']}
          def check(item):
            path,markers=item
            try:
              req=urllib.request.Request(root+path+'?verify=393-'+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                body=r.read().decode('utf-8','replace')
                return [path,r.status,all(m in body for m in markers)]
            except Exception as e:return [path,0,str(e)]
          for delay in [0,5,10,15]:
            time.sleep(delay)
            with concurrent.futures.ThreadPoolExecutor(max_workers=5) as p:
              rows=list(p.map(check,paths.items()))
            print('LIVE_RESULTS',json.dumps(rows,ensure_ascii=False),flush=True)
            if all(r[1]==200 and r[2] is True for r in rows):break
          else: raise SystemExit(1)
          PY
