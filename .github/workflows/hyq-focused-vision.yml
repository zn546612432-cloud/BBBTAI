name: Check published group restrictions and home indicator
on:
  push:
    branches: ['verify/hyq-vision-20261126']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read deployed modules
        run: |
          python3 - <<'PY'
          import urllib.request,concurrent.futures,time,json
          root='https://bbbtai.pages.dev/'
          paths={'':['/src/main.js'],'review/friends-test/':['phone-friends-test'],'src/system/home-indicator.js':['syncHomeIndicator','3000'],'src/apps/wechat/features/group/history.js':['hiddenGroupMessageIds','playerWeChatMessages'],'src/services/messaging/preset-replies.js':['暫無可發送的預設訊息']}
          def check(item):
            path,markers=item
            try:
              req=urllib.request.Request(root+path+'?verify=392-'+str(int(time.time())),headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=10) as r:
                body=r.read().decode('utf-8','replace')
                return [path,r.status,all(m in body for m in markers)]
            except Exception as e:return [path,0,str(e)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as p:
            rows=list(p.map(check,paths.items()))
          print('LIVE_RESULTS',json.dumps(rows,ensure_ascii=False),flush=True)
          assert all(r[1]==200 and r[2] is True for r in rows)
          PY
