name: Generate offline Macau base map (preview branch only)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/leaflet-apple-maps-preview-1103
    paths:
      - scripts/build-offline-macau.py
      - .github/workflows/offline-macau.yml
permissions:
  contents: write
concurrency:
  group: offline-macau-preview
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline vector converter
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1
      - name: Fetch lawful vector extract and generate bundled GeoJSON
        run: python scripts/build-offline-macau.py
      - name: Commit only generated map data to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps/maps/data/offline-macau-detail.js
          if ! git diff --cached --quiet; then
            git commit -m "data(maps): update bundled Macau offline vectors [skip ci]"
            git push origin HEAD:feat/leaflet-apple-maps-preview-1103
          fi
