name: D13 new mail promise audition only
on:
  push:
    branches: ['fix/d13-original-phone-voice-preview-20261124']
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate only the new D13 Dr Ouroboros phone sentence
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: node scripts/preview-d13-phone-voice.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: D13-new-mail-line-audition
          path: artifacts/d13-new-mail-line-audition/
          if-no-files-found: error
          retention-days: 7
