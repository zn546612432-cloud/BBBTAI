name: Check feature branches
on:
  push:
    branches: ['fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test 55-day browser migration
        run: node --test tests/story55-default-migration.test.mjs
      - name: Test existing 55-day graph
        run: node --test tests/story55-runtime.test.mjs
      - run: npm test
      - run: npm run build:pages
