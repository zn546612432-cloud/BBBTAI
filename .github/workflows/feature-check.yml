name: D13 original telephone voice audition (isolated)
on:
  push:
    branches: ['fix/d13-original-phone-voice-preview-20261124']
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Synthesize original D13 phone dialogue with existing MiniMax voice
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_REGION: cn
        run: node scripts/preview-d13-phone-voice.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D13-original-phone-voice-seven-MP3
          path: artifacts/d13-original-phone-audition/
          if-no-files-found: warn
          retention-days: 7
