name: D13 one-line retakes (original phone script)
on:
  push:
    branches: ['fix/d13-original-phone-voice-preview-20261124']
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Render two takes of D13 original phone line 16
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_REGION: cn
        run: node scripts/preview-d13-phone-voice.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D13-line16-original-script-retakes
          path: artifacts/d13-line16-retakes/
          if-no-files-found: warn
          retention-days: 7
