<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e0e"><title>GHOST · 程序预览</title><link rel="stylesheet" href="/src/apps/ghost/styles.css"><style>*{box-sizing:border-box}body{margin:0;background:#060b0b;color:#bfdbd7;font-family:ui-monospace,monospace}body:before{content:'GHOST / PRIVATE SOFTWARE';position:fixed;top:35px;left:35px;font-size:9px;letter-spacing:2px;color:#4f6e64}#root{max-width:440px;margin:40px auto;border:1px solid #21362f;min-height:820px}.preview-bar{max-width:440px;margin:0 auto;display:flex;justify-content:space-between;padding:10px 20px;color:#648477;font-size:9px}button{cursor:pointer}.preview-bar button{border:0;background:transparent;color:inherit;font:inherit}.gh-shell{min-height:820px}#mail{padding:30px;line-height:1.8}#mail h1{font-size:21px}#mail button{padding:14px;background:#bdd9cb;border:0;color:#102018;width:100%;margin-top:15px}#mail p{font-size:12px;color:#7d9b8c}@media(max-width:600px){body:before{display:none}#root{border:0;margin:0;min-height:100dvh}.gh-shell{min-height:calc(100dvh - 42px);padding-top:calc(24px + env(safe-area-inset-top))}.preview-bar{position:relative;margin-top:-40px;padding-bottom:env(safe-area-inset-bottom,10px)}}textarea{width:100%;height:350px;background:#102019;color:#bedaca;border:1px solid #456357;padding:15px}</style></head><body><main id="root"></main><div class="preview-bar"><span>INTERACTIVE PREVIEW</span><button id="preview-editor">SETTINGS</button></div><script type="module" src="/src/apps/ghost/preview.js"></script></body></html>
