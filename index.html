<div id="xm-boot">
 <div id="xm-boot-frame">
  <img src="/assets/startup/final.jpg" alt="">
  <video id="xm-boot-video" src="/assets/startup/intro.mp4" autoplay muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
  <button type="button" id="xm-boot-skip" hidden>略過片頭</button>
  <section id="xm-boot-tips" aria-label="彩蛋提示">
   <div class="xm-boot-kicker">MIRAGE / 2025</div><div class="xm-boot-rule"></div>
   <div id="xm-boot-tip-index"></div><p id="xm-boot-tip" aria-live="polite"></p>
   <div id="xm-boot-message" role="status"></div>
  </section>
  <div hidden><span id="xm-boot-percent">0%</span><div id="xm-boot-progress"><span></span></div></div>
  <button type="button" id="xm-boot-next" hidden>點擊進入</button>
 </div>
</div><div id="root"></div><script src="/src/system/startup/intro.js"></script><script>
(function(){
 var started=Date.now(),lastError='',stage='loading';
 var timer=null;
 function byId(id){return document.getElementById(id);}
 function explain(reason){
  var boot=byId('xm-boot');
  if(!boot||boot.classList.contains('xm-boot-done'))return;
  window.__xmBootIntroError?.();
  var percent=byId('xm-boot-percent'),msg=byId('xm-boot-message'),btn=byId('xm-boot-next');
  if(percent&&percent.textContent==='0%')percent.textContent='加载中';
  if(msg)msg.textContent=reason;
  if(btn){btn.hidden=false;btn.textContent='重新加载手机';btn.onclick=function(){
   var url=new URL(location.href);url.searchParams.set('boot-retry',String(Date.now()));location.replace(url.href);
  };}
 }
 window.__xmBootStarted=function(){stage='started';clearTimeout(timer);};
 window.__xmBootError=function(message){lastError=String(message||'');explain('手机程序尚未完成启动。'+(lastError?'错误：'+lastError.slice(0,115):'请检查网络连接。'))};
 window.addEventListener('error',function(event){
  if(stage==='started')return;
  if(event.target?.id==='xm-boot-video')return;
  lastError=event.message||'资源加载失败';
 });
 window.addEventListener('unhandledrejection',function(event){
  if(stage==='started')return;
  lastError=event.reason&&event.reason.message||'模块加载中断';
 });
 timer=setTimeout(function(){
  if(stage==='started')return;
  explain('手机程序启动超时'+(lastError?'：'+lastError.slice(0,100):'，可能有资源无法加载。')+' 请重新加载。');
 },12000);
})();
</script><script type="module" src="/src/main.js"></script></body></html>
